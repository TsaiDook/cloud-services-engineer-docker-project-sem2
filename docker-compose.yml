services:
  backend:
    build:
      context: ./backend
    image: momo-backend:1.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    secrets:
      - order_id_secret
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: http://localhost:8081
    image: momo-frontend:1.0
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/momo-store/" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
secrets:
  order_id_secret:
    file: ./order_id_secret.txt