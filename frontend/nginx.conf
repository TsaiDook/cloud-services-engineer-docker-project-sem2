server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /momo-store {
        return 301 /momo-store/;
    }

    location /momo-store/ {
        rewrite ^/momo-store/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}